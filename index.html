<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yoan Cuervo</title>
    <meta
      name="description"
      content="Yoan Cuervo, web developer. I am a problem solver passionate about building thoughtful, engaging digital experiences."
    />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e8e4df" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Link previews (LinkedIn, Discord, WhatsApp, X): the crawlers do not run
         JavaScript and need absolute URLs, so the address is written in full. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yoancuervo.github.io/Portfolio/" />
    <meta property="og:title" content="Yoan Cuervo · Web Developer" />
    <meta
      property="og:description"
      content="I am a problem solver passionate about building thoughtful, engaging digital experiences."
    />
    <meta property="og:image" content="https://yoancuervo.github.io/Portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yoan Cuervo, Web Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      {
        let theme;
        try {
          theme = localStorage.getItem("theme");
        } catch {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
