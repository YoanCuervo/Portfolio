<!doctype html>
<!--
  Source of public/og-image.png, the link preview image (1200 x 630).
  Regenerate from the repository root (Git Bash), after `npm install`:
  "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3000 --window-size=1200,630 --screenshot="$(pwd -W)/public/og-image.png" "file:///$(pwd -W)/scripts/share-images/og-image.html"
  pwd -W gives the Windows form of the path (C:/...), which Edge needs.
  Colors are copied from the dark theme of src/styles/tokens.css: this page is
  not part of the site and cannot read its variables.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Cormorant";
        font-weight: 600;
        src: url("../../node_modules/@fontsource/cormorant/files/cormorant-latin-600-normal.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "Cormorant";
        font-style: italic;
        font-weight: 400;
        src: url("../../node_modules/@fontsource/cormorant/files/cormorant-latin-400-italic.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 300;
        src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-300-normal.woff2")
          format("woff2");
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0f0f0f;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }

      .halo {
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        filter: blur(90px);
      }

      .amber {
        width: 520px;
        height: 520px;
        right: -120px;
        top: -180px;
        background: #d4a574;
        opacity: 0.32;
      }

      .rose {
        width: 440px;
        height: 440px;
        left: -160px;
        bottom: -200px;
        background: #e8b4b8;
        opacity: 0.22;
      }

      .gold {
        width: 300px;
        height: 300px;
        right: 220px;
        bottom: -150px;
        background: #c9b896;
        opacity: 0.18;
      }

      .name {
        color: #e8e4df;
        font-family: "Cormorant", serif;
        font-size: 148px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
      }

      .role {
        margin-top: 14px;
        color: #d4a574;
        font-family: "Cormorant", serif;
        font-size: 64px;
        font-style: italic;
        font-weight: 400;
      }

      .intro {
        max-width: 780px;
        margin-top: 34px;
        color: #9a9590;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 26px;
        font-weight: 300;
        line-height: 1.5;
      }

      .rule {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 56px;
        border-top: 1px solid #34302c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="halo amber"></div>
      <div class="halo rose"></div>
      <div class="halo gold"></div>
      <p class="name">Yoan Cuervo</p>
      <p class="role">Web Developer</p>
      <p class="intro">
        I am a problem solver passionate about building thoughtful, engaging
        digital experiences.
      </p>
      <div class="rule"></div>
    </div>
  </body>
</html>
